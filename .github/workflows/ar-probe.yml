# 임시: 깃허브 실행기에서 어떤 공개 데이터 소스가 실제로 열리는지 점검. 확인 후 삭제.
name: ar-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          while IFS= read -r u; do
            [ -z "$u" ] && continue
            code=$(curl -sS -L -m 25 -A "$UA" -o /tmp/o -w '%{http_code} %{size_download}' "$u" 2>/tmp/e || echo "ERR $(head -c 80 /tmp/e)")
            echo "=== $code :: $u"
            head -c 500 /tmp/o 2>/dev/null | tr '\n' ' '; echo; echo "... $(tail -c 220 /tmp/o 2>/dev/null | tr '\n' ' ')"
            : > /tmp/o
          done <<'URLS'
          https://api.stock.naver.com/index/.INX/price?page=1&pageSize=5
          https://api.stock.naver.com/index/.INX/price?page=1&pageSize=600
          https://api.stock.naver.com/index/.INX/price?page=120&pageSize=60
          https://api.stock.naver.com/index/.IXIC/price?page=1&pageSize=3
          https://api.stock.naver.com/index/.VIX/price?page=1&pageSize=3
          https://api.stock.naver.com/marketindex/exchange/FX_USDKRW/prices?page=1&pageSize=3
          https://api.stock.naver.com/marketindex/exchange/FX_USDKRW/prices?page=100&pageSize=60
          https://api.stock.naver.com/marketindex/energy/CLcv1/prices?page=1&pageSize=3
          https://api.stock.naver.com/marketindex/metals/GCcv1/prices?page=1&pageSize=3
          https://api.stock.naver.com/marketindex/bond/US10YT=RR/prices?page=1&pageSize=3
          https://api.stock.naver.com/marketindex/bond/US2YT=RR/prices?page=1&pageSize=3
          https://finance.naver.com/world/worldDayListJson.naver?symbol=SPI@SPX&fdtc=0&page=1
          https://cdn.cboe.com/api/global/us_indices/daily_prices/VIX_History.csv
          https://cdn.cboe.com/api/global/us_indices/daily_prices/SPX_History.csv
          https://api.frankfurter.dev/v1/2026-11-01..?base=USD&symbols=KRW
          https://api.exchange.coinbase.com/products/BTC-USD/candles?granularity=86400
          https://api.db.nomics.world/v22/series/FED/H15/RIFLGFCY10_N.B?observations=1
          https://api.db.nomics.world/v22/series/FED/H15/RIFLGFCY02_N.B?observations=1
          https://query2.finance.yahoo.com/v8/finance/chart/%5EGSPC?range=5d&interval=1d
          https://api.stlouisfed.org/fred/series/observations?series_id=DGS10&api_key=x&file_type=json
          https://fred.stlouisfed.org/graph/fredgraph.csv?id=DGS10
          https://stooq.com/q/d/l/?s=%5Espx&i=d
          https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv/2026/all?type=daily_treasury_yield_curve&field_tdr_date_value=2026&page&_format=csv
          URLS
