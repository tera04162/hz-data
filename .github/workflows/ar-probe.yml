# 임시: 장기 이력 소스 점검. 확인 후 삭제.
name: ar-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          while IFS= read -r u; do
            [ -z "$u" ] && continue
            code=$(curl -sS -L -m 25 -A "$UA" -H 'Accept: application/json, text/plain, */*' -o /tmp/o -w '%{http_code} %{size_download}' "$u" 2>/tmp/e || echo "ERR $(head -c 80 /tmp/e)")
            echo "=== $code :: $u"
            iconv -f euc-kr -t utf-8 /tmp/o 2>/dev/null > /tmp/o2 || cp /tmp/o /tmp/o2
            head -c 330 /tmp/o | tr '\n' ' '; echo; echo "... $(tail -c 200 /tmp/o | tr '\n' ' ')"
            grep -o 'class="date">[^<]*' /tmp/o2 | head -2 | tr '\n' ' '; grep -o '<td class="num">[^<]*' /tmp/o2 | head -2 | tr '\n' ' '; echo
            : > /tmp/o
          done <<'URLS'
          https://finance.naver.com/world/worldDayListJson.naver?symbol=NAS@IXIC&fdtc=0&page=400
          https://finance.naver.com/world/worldDayListJson.naver?symbol=NAS@IXIC&fdtc=0&page=700
          https://finance.naver.com/world/worldDayListJson.naver?symbol=NAS@IXIC&fdtc=0&page=1300
          https://finance.naver.com/marketindex/worldDailyQuote.naver?marketindexCd=OIL_CL&fdtc=2&page=1
          https://finance.naver.com/marketindex/worldDailyQuote.naver?marketindexCd=OIL_CL&fdtc=2&page=600
          https://finance.naver.com/marketindex/worldDailyQuote.naver?marketindexCd=CMDT_GC&fdtc=2&page=600
          https://prices.lbma.org.uk/json/gold_pm.json
          https://api.db.nomics.world/v22/series/EIA/PET/RWTC.D?observations=1
          https://api.db.nomics.world/v22/search?q=WTI%20spot%20price%20daily&limit=3
          https://api.stock.naver.com/chart/foreign/index/.IXIC/day?startDateTime=200001010000&endDateTime=200002010000
          https://api.stock.naver.com/chart/foreign/index/.IXIC?periodType=dayCandle
          https://api.stock.naver.com/chart/marketindex/energy/CLcv1/day?startDateTime=200501010000&endDateTime=200502010000
          https://api.stock.naver.com/chart/marketindex/metals/GCcv1/day?startDateTime=200501010000&endDateTime=200502010000
          https://api.nasdaq.com/api/quote/COMP/historical?assetclass=index&fromdate=2000-01-01&todate=2026-11-13&limit=9999
          https://api.nasdaq.com/api/quote/COMP/chart?assetclass=index&fromdate=2000-01-01&todate=2026-11-13
          URLS
