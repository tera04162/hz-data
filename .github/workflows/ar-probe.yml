# 임시: 장기 이력 소스 점검. 확인 후 삭제.
name: ar-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          while IFS= read -r u; do
            [ -z "$u" ] && continue
            code=$(curl -sS -L -m 30 -A "$UA" -H 'Accept: application/json, text/csv, text/plain, */*' -o /tmp/o -w '%{http_code} %{size_download}' "$u" 2>/tmp/e || echo "ERR $(head -c 80 /tmp/e)")
            echo "=== $code :: $u"
            head -c 420 /tmp/o | tr '\n' ' ' | tr -cd '[:print:]'; echo; echo "... $(tail -c 260 /tmp/o | tr '\n' ' ' | tr -cd '[:print:]')"
            : > /tmp/o
          done <<'URLS'
          https://api.db.nomics.world/v22/search?q=gold%20price%20london%20daily&limit=6
          https://api.db.nomics.world/v22/series/LBMA/gold/gold_D_USD_PM?observations=1
          https://api.db.nomics.world/v22/series/BUBA/BBEX3/D.XAU.USD.EA.AC.C04?observations=1
          https://api.statistiken.bundesbank.de/rest/data/BBEX3/D.XAU.USD.EA.AC.C04?format=csv&lang=en
          https://api.db.nomics.world/v22/series/FED/H10/JRXWTFB_N.B?observations=1
          https://www.chicagofed.org/-/media/publications/nfci/nfci-data-series-csv.csv
          https://api.db.nomics.world/v22/search?q=high%20yield%20option-adjusted%20spread&limit=6
          https://api.nasdaq.com/api/quote/GLD/historical?assetclass=etf&fromdate=2004-01-01&todate=2026-11-14&limit=9999
          https://api.nasdaq.com/api/quote/HYG/historical?assetclass=etf&fromdate=2007-01-01&todate=2026-11-14&limit=9999
          https://api.nasdaq.com/api/quote/CL%3ANMX/historical?assetclass=commodities&fromdate=2000-01-01&todate=2026-11-14&limit=9999
          https://api.nasdaq.com/api/quote/GC%3ACMX/historical?assetclass=commodities&fromdate=2000-01-01&todate=2026-11-14&limit=9999
          https://api.eia.gov/v2/petroleum/pri/spt/data/?api_key=x
          https://www.eia.gov/dnav/pet/hist_xls/RWTCd.xls
          https://api.db.nomics.world/v22/series/EIA/PET/RBRTE.D?observations=1
          URLS
