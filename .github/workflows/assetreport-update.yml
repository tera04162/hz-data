# 에셋리포트(assetreport.kr) 데이터 자동 갱신.
# 코드와 데이터는 전부 'assetreport' 브랜치에 있다. 이 파일만 main에 둔다(예약 실행은 기본 브랜치에서만 돈다).
name: assetreport-update

on:
  schedule:
    - cron: '17 22 * * *'    # 한국 07:17 — 미국 장 마감 후
    - cron: '47 7 * * 1-5'   # 한국 16:47 — 한국 장 마감 후
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: assetreport-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assetreport
      - name: 테스트
        run: python3 -m unittest discover -s tests
      - name: 수집
        run: python3 -u src/fetch.py
      - name: 종목 수집
        run: python3 -u src/fetch_stocks.py
      - name: 계산
        run: python3 src/build.py
      - name: 글 주소 연결
        run: python3 src/links.py
      - name: 커밋
        run: |
          git config user.name "assetreport-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -q -m "데이터 갱신 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin assetreport
          fi
      - name: CDN 갱신
        # 블로그는 jsDelivr(무료 CDN)에서 데이터와 위젯을 읽는다. 브랜치 주소는 최대 12시간 캐시되므로 갱신 직후 비운다.
        # 실패해도 작업은 성공 처리 — 그 경우 CDN이 스스로 갱신될 때까지 직전 값이 보일 뿐이다.
        run: |
          B="https://purge.jsdelivr.net/gh/tera04162/hz-data@assetreport/docs"
          ok=0; bad=0
          for f in widget/ar.js data/market.json data/events.json data/links.json $(cd docs/data && ls events/*.json | sed 's#^#data/#'); do
            if curl -fsS -m 20 -o /dev/null "$B/$f"; then ok=$((ok+1)); else bad=$((bad+1)); fi
          done
          echo "CDN 갱신 요청: 성공 $ok, 실패 $bad"
